server:
  port: 8081

spring:
  application:
    name: contract-service
  # 激活本地环境：数据源账号密码等敏感信息在 application-local.yml（已被 .gitignore 忽略）
  profiles:
    active: local

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

# MyBatis-Plus 配置
mybatis-plus:
  # 自定义 XML Mapper 位置
  mapper-locations: classpath*:mapper/*.xml
  # 实体别名包（XML 中可直接使用类名简写）
  type-aliases-package: com.contractguard.service.entity
  configuration:
    # 下划线字段自动映射为驼峰：clause_no -> clauseNo
    map-underscore-to-camel-case: true
    # 打印 SQL 日志，便于开发调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.contractguard: INFO
